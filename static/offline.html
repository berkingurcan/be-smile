<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F7F5EC"><title>Be Smile — Offline</title><style>*{box-sizing:border-box}body{margin:0;background:#F7F5EC;color:#183D32;font:16px/1.7 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:30px}main{max-width:480px}svg{width:72px;height:72px;margin-bottom:35px}h1{font-size:clamp(34px,9vw,52px);line-height:1.1;letter-spacing:-2px;font-weight:600;margin:0 0 22px}p{margin:0 0 25px}button{font:inherit;min-height:52px;padding:12px 25px;border:0;border-radius:30px;background:#183D32;color:#F7F5EC;cursor:pointer}button:focus-visible{outline:3px solid #9D432F;outline-offset:5px}.note{font-size:13px;margin-top:25px}</style><main><svg viewBox="0 0 128 128" role="img" aria-label="Be Smile"><circle cx="64" cy="64" r="58" fill="#F4C84A"/><path d="M37 67C46 88 82 88 91 67" fill="none" stroke="#183D32" stroke-width="9" stroke-linecap="round"/></svg><h1 id="title">A little pause.</h1><p id="body">You’re offline. Reconnect to explore jobs and send your application.</p><button id="retry" onclick="location.reload()">Try again ↗</button><p class="note" id="note">Applications and CVs are never saved or sent offline.</p></main><script>const path=location.pathname;const language=(/\/tr\//.test(path)||/\/hotels\//.test(path))?'tr':/\/de\//.test(path)?'de':/\/en\//.test(path)?'en':'ru';const text={tr:['Kısa bir mola.','Şu an çevrimdışısın. İşleri incelemek ve başvurmak için internete bağlan.','Tekrar dene ↗','Başvurular ve CV’ler çevrimdışı kaydedilmez veya gönderilmez.'],ru:['Небольшая пауза.','Сейчас нет интернета. Подключись, чтобы посмотреть вакансии и отправить отклик.','Попробовать ещё ↗','Заявки и резюме не сохраняются и не отправляются офлайн.'],de:['Eine kurze Pause.','Du bist offline. Verbinde dich mit dem Internet, um Jobs anzusehen und dich zu bewerben.','Erneut versuchen ↗','Bewerbungen und Lebensläufe werden offline weder gespeichert noch gesendet.'],en:['A little pause.','You’re offline. Reconnect to explore jobs and send your application.','Try again ↗','Applications and CVs are never saved or sent offline.']}[language];document.documentElement.lang=language;['title','body','retry','note'].forEach((id,i)=>document.getElementById(id).textContent=text[i]);</script></html>
